    advanced:
      enabled: "Włącz zaawansowane filtry (Więcej filtrów)"
      enabled_help: "Dodaje zwijany panel „Więcej filtrów” w prawym dolnym rogu filtrów oraz opcjonalne dodatkowe pola i sortowania. Każdy filtr poniżej włączasz osobno; dopóki to jest wyłączone, na forum nic się nie zmienia."
      open_default: "„Więcej filtrów” domyślnie rozwinięte"
      open_default_help: "Domyślnie panel jest zwinięty przy każdym wejściu i rozwija się dopiero po kliknięciu „Więcej filtrów”."
      filters_header: "Filtry"
      requires: "Wymaga rozszerzenia {extension} (nie jest włączone)"
      meta_badge: "indeks"
      meta_badge_help: "Odczytywane z tytułu i pierwszego posta — wymaga indeksu poniżej."
      filter_type: "Typ: filmy / seriale"
      filter_type_help: "Przełącznik Wszystko / Filmy / Seriale obok „Więcej filtrów” (albo lista w głównym rzędzie / w panelu). Seriale są rozpoznawane z treści posta: pole rodzaju (np. „Serial: TV Series”), sezony / epizody albo znaczniki S01E01."
      filter_size: "Rozmiar"
      filter_size_help: "Od – do w MB / GB / TB, z dokładnej długości w magnecie, linii „Rozmiar:” albo z tytułu."
      filter_year: "Rok wydania"
