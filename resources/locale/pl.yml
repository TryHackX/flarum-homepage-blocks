      title_min_length: "Minimalna długość tytułu"
      title_max_length: "Maksymalna długość tytułu"
      title_length_help: "Kolumna tytułu to varchar(200). Min musi wynosić co najmniej 1, max co najwyżej 200."
      content_length_enabled: "Włącz modyfikację długości treści"
      content_min_length: "Minimalna długość treści"
      content_max_length: "Maksymalna długość treści"
      content_length_help: "Kolumna treści to mediumtext (do 16 milionów znaków). Ustaw 0 aby pozwolić na puste posty."
      restore_defaults: "Domyślne"
      theme_mode: "Tryb motywu"
      theme_mode_help: "Auto podąża za jasnym / ciemnym trybem forum (także przełącznikiem w nagłówku). Jasny / Ciemny zawsze używają jasnych lub ciemnych kolorów forum dla bloków."
      theme_mode_auto: "Auto (jak forum)"
      theme_mode_light: "Jasny"
      theme_mode_dark: "Ciemny"
      style: "Styl"
      style_help: "Dopasowany wtapia bloki w wygląd forum. Oryginalny to osobny styl kart — zaokrąglone karty z delikatnym cieniem, nagłówek zabarwiony kolorem głównym, kafelki statystyk — zbudowany z kolorów Twojego forum. Oba reagują na tryb jasny / ciemny."
      style_fitted: "Dopasowany (wtapia się w forum)"
      style_original: "Oryginalny (karty)"
      category_label: "Własna nazwa filtra kategorii"
      category_label_help: "Pozostaw puste aby użyć domyślnego tłumaczenia."
      resolution_label: "Własna nazwa filtra rozdzielczości"
      resolution_label_help: "Pozostaw puste aby użyć domyślnego tłumaczenia."
    whitelist:
      enabled: "Włącz synchronizację whitelisty trackera"
      enabled_help: "Każdy magnet link opublikowany na forum (nowy post, edycja, zatwierdzenie) jest rejestrowany na białej liście trackera przez jego API serwer-serwer. Wymaga tryhackx-tracker >= 1.2.0 w trybie whitelist oraz PHP ext-curl."
      api_url: "Adres trackera"
      api_url_help: "Bazowy URL aplikacji trackera, np. https://tracker.example.org (tylko http/https, bez ścieżki na końcu)."
      api_key_id: "ID klucza API"
      api_key_id_help: "16-znakowy identyfikator klucza pokazany przy tworzeniu klienta API w panelu trackera (Whitelist → API clients)."
      api_secret: "Sekret API"
      api_secret_help: "Wklej sekret (lub cały token key_id.secret) i naciśnij Zapisz sekret. Jest przechowywany wyłącznie po stronie serwera i nigdy nie wraca do przeglądarki."
      secret_placeholder_set: "•••••••• (zapisany)"
      secret_placeholder_empty: "wklej sekret lub key_id.secret"
      secret_save: "Zapisz sekret"
      secret_clear: "Wyczyść"
      secret_is_set: "Sekret jest zapisany."
      secret_not_set: "Brak zapisanego sekretu — synchronizacja nieaktywna."
      secret_saved: "Sekret zapisany."
      secret_cleared: "Sekret usunięty."
      secret_error: "Nie udało się zapisać sekretu (niepoprawna wartość lub błąd żądania)."
      timeout: "Timeout (s)"
      timeout_help: "Limit czasu jednego żądania rejestrującego magnety (1–10 s, domyślnie 3); opisy tematów mają własne 20 s. Błędy nigdy nie blokują posta: zmiana czeka w kolejce i jest później wysyłana ponownie."
      bare_hashes: "Wykrywaj też gołe 40-znakowe hashe hex w postach"
      bare_hashes_help: "Domyślnie wyłączone: na forum security gołe ciągi 40 hex to zwykle commity gita lub SHA-1 (IOC), nie torrenty. Magnet linki i fragmenty btih: są wykrywane zawsze."
      require_tracker: "Synchronizuj tylko magnety wskazujące na nasz tracker"
      require_tracker_help: "Domyślnie wyłączone. Po włączeniu hash jest wysyłany tylko wtedy, gdy jego magnet link ma w parametrze tr= (announce) jeden z poniższych hostów. Gołe fragmenty btih: i gołe hashe 40 hex nie mają trackera i są pomijane."
      tracker_hosts: "Hosty trackera"
      tracker_hosts_help: "Nazwy hostów lub IP Twojego trackera, rozdzielone przecinkami / nowymi liniami (akceptowane też host:port i pełne URL-e; dopasowanie bez rozróżniania wielkości liter). Pusta lista = nic nie zostanie wysłane — zgłosi to linia ostatniego błędu."
      describe: "Wysyłaj opisy tematów do trackera"
      describe_help: "Domyślnie wyłączone. Gdy magnety z pierwszego posta tematu zostaną zsynchronizowane, do trackera trafia też treść tego posta (dokładnie tak, jak wpisał ją autor), jego autor, link i czas ostatniej edycji — tracker używa jej jako opisu tych torrentów: opis czeka na jego moderatorów albo jest publikowany od razu, zależnie od ustawień tego klucza API na trackerze. Tracker pokazuje to, co na forum widzi gość: temat, którego gość nie widzi (ukryty lub usunięty pierwszy post albo dyskusja, temat prywatny, przeniesiony do tagu niewidocznego dla gości, czekający na zatwierdzenie), zostaje wycofany z trackera i wraca, gdy gość znów go zobaczy; hash usunięty z pierwszego posta i usunięta dyskusja zostają na trackerze zwolnione. Odpowiedzi nigdy nie są wysyłane. Każda zmiana czeka w kolejce i jest wysyłana ponownie, dopóki tracker jej nie przyjmie. Razem z opisem wysyłany jest limit długości treści tego forum (z Ustawień treści, a gdy ta modyfikacja jest wyłączona — rdzeniowe 63 000 znaków); post dłuższy niż ten limit idzie bez treści. Wymaga tryhackx-tracker 1.78.0 lub nowszego oraz włączonej dla tego klucza opcji „Opisy z forum” (wycofywanie wymaga 1.81.0). Skanowanie całego forum również wysyła i odświeża opisy."
      audience: "Wysyłaj tematy widoczne dla"
      audience_guests: "Gości (domyślnie)"
      audience_members: "Członków"
      audience_help: "Które posty synchronizacja traktuje jako publiczne: te, które widzi gość, albo te, które widzi każdy zalogowany członek z potwierdzonym e-mailem. Magnety rejestrowane na trackerze idą za tym samym wyborem. Przy „Członkach” tracker pokazuje opisy tych tematów tylko zalogowanym. Po zmianie kliknij „Wyślij / odśwież opisy wszystkich tematów”: tematy, które stały się widoczne, zostaną wysłane, a te, które przestały być widoczne — wycofane."
      image_copy: "Pozwól trackerowi kopiować obrazy z postów"
      image_copy_help: "Domyślnie wyłączone. Po włączeniu tracker trzyma własne kopie obrazów z forum (z domen ustawionych przy tym kluczu API na trackerze) i podmienia ich adresy w przechowywanych opisach. Gdy wyłączone, tracker pokazuje obrazy spod adresów forum. Tracker kopiuje je tylko wtedy, gdy zgadzają się obie strony. Wycofanie zgody wstrzymuje nowe kopie, kopie już zrobione zostają. Zmiana trafia do trackera zaraz po zapisaniu ustawień i jest wysyłana ponownie, dopóki tracker jej nie potwierdzi; test połączenia tylko pokazuje stan i nigdy go nie zmienia."
      describe_all_button: "Wyślij / odśwież opisy wszystkich tematów"
      describe_all_help: "Przechodzi pierwszy post każdego tematu widocznego dla wybranej grupy odbiorców, najpierw rejestruje jego magnety, a potem ponownie wysyła opis — jedno żądanie na partię, z możliwością wznowienia, tak jak skanowanie całego forum. Teksty, które tracker już ma, wracają jako „bez zmian” i niczego nie zapisują; nowe lub zmienione są tworzone, aktualizowane albo trafiają do kolejki, zależnie od ustawień tego klucza API na trackerze. Tematy wysłane wcześniej, których odbiorcy już nie widzą (ukryte, prywatne, w tagu dla nich niewidocznym), zostają wycofane, a usunięte — zwolnione. Mieści się w limicie żądań trackera i sam czeka, gdy tracker prosi o zwolnienie tempa; temat, przy którym tracker zawiedzie, czeka w kolejce zamiast zatrzymywać przebieg. Wymaga zapisanej i włączonej synchronizacji whitelisty oraz opcji „Wysyłaj opisy tematów do trackera”."
      describe_all_progress: "Tematy: {processed}/{total}"
      describe_all_done: "Opisy wysłane — tematy: {processed}, opublikowane: {published}, czekające: {waiting}, bez zmian: {unchanged}, wycofane: {withdrawn}."
      describe_all_running: "Trwa już partia skanowania forum albo wysyłania opisów (inna karta?). Spróbuj za chwilę."
      describe_all_disabled: "Włącz synchronizację whitelisty i opcję „Wysyłaj opisy tematów do trackera”, a potem zapisz."
      describe_all_off: "Opisy są wyłączone na trackerze (dla tego klucza albo w całości) — zatrzymano. Naciśnij Wznów, gdy test połączenia pokaże je jako włączone."
      test_button: "Testuj połączenie"
      test_help: "Wywołuje endpoint ping trackera z powyższymi wartościami (użyty zostanie wpisany, niezapisany sekret). Przed testem dodaj wychodzące IP tego forum do api_ban_exempt_ips w trackerze — domyślnie wyjątkiem są tylko własne adresy trackera; zły ID klucza / sekret skutkuje banem tego IP na trackerze na 30 dni."
      test_ok: "Połączono — tryb trackera {mode}, {count} hashy na whitelist, przesunięcie zegara {skew}s, {ms} ms."
      test_fail: "Błąd: {error}."
      test_forbidden_hint: "Sprawdź ID klucza / sekret; tracker mógł też zbanować IP tego serwera (panel trackera → Whitelist → API bans)."
      test_invalid_credentials_hint: "Nic nie wysłano: ID klucza musi mieć 16 znaków hex, a sekret 64 znaki hex (albo jeden token key_id.secret)."
      test_describe: "Opisy: {mode}."
      test_describe_unknown: "Opisy: tracker nie podaje trybu (wymaga tryhackx-tracker 1.78.0 lub nowszego)."
      describe_mode_off: "wyłączone na trackerze"
      describe_mode_queue: "czekają na moderatorów trackera"
      describe_mode_publish: "publikowane od razu"
      test_images_copy: "Obrazy: tracker kopiuje je do siebie (domeny: {domains})."
      test_images_off: "Obrazy: tracker ich nie kopiuje (brak domen przy kluczu)."
      test_images_no_consent: "Obrazy: tracker chce je kopiować — zaznacz zgodę powyżej i zapisz."
      test_images_consent_pending: "Obrazy: tracker chce je kopiować; zgoda forum jeszcze do niego nie dotarła — jest wysyłana ponownie, dopóki tracker jej nie potwierdzi."
      test_images_withdraw_pending: "Obrazy: tracker nadal je kopiuje; wycofanie zgody jeszcze do niego nie dotarło — jest wysyłane ponownie, dopóki tracker go nie potwierdzi. Kopie już zrobione zostają."
      scan_button: "Skanuj całe forum"
      scan_cancel: "Anuluj"
      scan_resume: "Wznów"
      scan_help: "Przechodzi partiami wszystkie posty widoczne dla gościa (jedno żądanie na partię, bezpiecznie poniżej limitu czasu PHP), wyciąga magnet linki i wysyła je do trackera. Można uruchamiać wielokrotnie: istniejące hashe wracają jako już zarejestrowane. Przy błędzie trackera partia nie jest pomijana — naciśnij Wznów. Opis, którego tracker nie przyjmie, czeka w kolejce i nie zatrzymuje skanowania."
