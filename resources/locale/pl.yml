      external_stats_enabled: "Włącz statystyki zewnętrzne trackera (OpenTracker)"
      external_stats_native_url: "Bezpośredni URL OpenTrackera"
      external_stats_native_url_help: "Bezpośredni URL statystyk OpenTrackera zwracający XML. Przykład: http://IP:6969/stats?mode=everything"
      external_stats_cache_ttl: "Czas życia cache statystyk (sekundy)"
      external_stats_cache_ttl_help: "Jak długo pobrane statystyki są uznawane za świeże. Przez ten czas nikt nie odpytuje trackera — wszyscy dostają dane ze wspólnego cache. Domyślnie: 30 s."
      external_stats_max_time: "Maksymalny czas pobierania statystyk (sekundy)"
      external_stats_max_time_help: "Limit czasu pojedynczego pobrania z trackera. Duży tracker liczy statystyki nawet ~minutę — podnieś, jeśli nie zdążają się załadować. Pobiera tylko jeden worker naraz. Domyślnie: 30 s."
      external_stats_refresh: "Interwał odświeżania statystyk zewnętrznych (sekundy)"
      external_stats_refresh_help: "Jak często odświeżać statystyki trackera. Domyślnie: 5 sekund."
      search_debounce_ms: "Opóźnienie wyszukiwania (ms)"
      search_debounce_ms_help: "Opóźnienie przed uruchomieniem wyszukiwania podczas pisania. Wyższe = mniej żądań. Domyślnie: 500ms"
      ratelimit_enabled: "Włącz limiter punktowy (rate limiting)"
      ratelimit_enabled_help: "Każdy odwiedzający ma budżet punktów na wyszukiwanie, który odnawia się w czasie — dzięki temu zwykłe korzystanie jest płynne, a szybkie spamowanie zostaje zatrzymane. Po wyczerpaniu budżetu IP zostaje tymczasowo zablokowane (ustawienia poniżej)."
      ratelimit_block_header: "Po wyczerpaniu punktów → tymczasowa blokada IP"
      ratelimit_start: "Początkowy stan punktów"
      ratelimit_start_help: "Punkty startowe dla każdego odwiedzającego. Domyślnie: 10"
      ratelimit_refill_seconds: "Interwał odnawiania (sekundy)"
      ratelimit_refill_seconds_help: "Jak często dodawane jest +N punktów. Domyślnie: 15s"
      ratelimit_refill_amount: "Ilość punktów dodawana za interwał"
      ratelimit_refill_amount_help: "Ile punktów jest dodawane w każdym interwale. Domyślnie: 1"
      ratelimit_guest_extra: "Dodatkowy koszt dla niezalogowanych"
      ratelimit_guest_extra_help: "Dodawany do kosztu każdej akcji dla gości. Domyślnie: +2"
      ratelimit_cost_search: "Koszt — Wyszukiwanie / Filtry"
      ratelimit_block_seconds: "Czas blokady IP (sekundy)"
      ratelimit_block_seconds_help: "Jak długo IP pozostaje zablokowane po wyczerpaniu punktów. Podczas blokady punkty się nie odnawiają. Domyślnie: 60s"
      ratelimit_block_reset: "Gdy blokada się kończy"
      ratelimit_block_reset_full: "Przywróć pełny budżet"
      ratelimit_block_reset_empty: "Zacznij od zera (odnawiaj od 0)"
      ratelimit_block_reset_help: "Co dzieje się z budżetem po wygaśnięciu blokady IP. Tryb pełny jest łagodniejszy; tryb od zera dalej trzyma w ryzach (punkty wracają potem w tempie odnawiania). Podczas blokady punkty NIGDY się nie odnawiają — trwa ona zawsze pełny czas i nie jest zdejmowana wcześniej."
      ratelimit_costs_header: "Koszty akcji"
      title_length_enabled: "Włącz modyfikację długości tytułu"
      title_min_length: "Minimalna długość tytułu"
      title_max_length: "Maksymalna długość tytułu"
      title_length_help: "Kolumna tytułu to varchar(200). Min musi wynosić co najmniej 1, max co najwyżej 200."
      content_length_enabled: "Włącz modyfikację długości treści"
      content_min_length: "Minimalna długość treści"
      content_max_length: "Maksymalna długość treści"
      content_length_help: "Kolumna treści to mediumtext (do 16 milionów znaków). Ustaw 0 aby pozwolić na puste posty."
      restore_defaults: "Domyślne"
      theme_mode: "Tryb motywu"
      theme_mode_help: "Auto wykrywa preferencje ciemnego motywu systemu/przeglądarki."
      category_label: "Własna nazwa filtra kategorii"
      category_label_help: "Pozostaw puste aby użyć domyślnego tłumaczenia."
      resolution_label: "Własna nazwa filtra rozdzielczości"
      resolution_label_help: "Pozostaw puste aby użyć domyślnego tłumaczenia."
    whitelist:
      enabled: "Włącz synchronizację whitelisty trackera"
      enabled_help: "Każdy magnet link opublikowany na forum (nowy post, edycja, zatwierdzenie) jest rejestrowany na białej liście trackera przez jego API serwer-serwer. Wymaga tryhackx-tracker >= 1.2.0 w trybie whitelist oraz PHP ext-curl."
      api_url: "Adres trackera"
      api_url_help: "Bazowy URL aplikacji trackera, np. https://tracker.example.org (tylko http/https, bez ścieżki na końcu)."
      api_key_id: "ID klucza API"
      api_key_id_help: "16-znakowy identyfikator klucza pokazany przy tworzeniu klienta API w panelu trackera (Whitelist → API clients)."
      api_secret: "Sekret API"
      api_secret_help: "Wklej sekret (lub cały token key_id.secret) i naciśnij Zapisz sekret. Jest przechowywany wyłącznie po stronie serwera i nigdy nie wraca do przeglądarki."
      secret_placeholder_set: "•••••••• (zapisany)"
      secret_placeholder_empty: "wklej sekret lub key_id.secret"
      secret_save: "Zapisz sekret"
      secret_clear: "Wyczyść"
      secret_is_set: "Sekret jest zapisany."
      secret_not_set: "Brak zapisanego sekretu — synchronizacja nieaktywna."
      secret_saved: "Sekret zapisany."
      secret_cleared: "Sekret usunięty."
      secret_error: "Nie udało się zapisać sekretu (niepoprawna wartość lub błąd żądania)."
      timeout: "Timeout (s)"
      timeout_help: "Limit czasu jednego żądania przy synchronizacji na żywo podczas zapisu posta (1–10 s, domyślnie 3). Błędy nigdy nie blokują posta."
      bare_hashes: "Wykrywaj też gołe 40-znakowe hashe hex w postach"
      bare_hashes_help: "Domyślnie wyłączone: na forum security gołe ciągi 40 hex to zwykle commity gita lub SHA-1 (IOC), nie torrenty. Magnet linki i fragmenty btih: są wykrywane zawsze."
      test_button: "Testuj połączenie"
      test_help: "Wywołuje endpoint ping trackera z powyższymi wartościami (użyty zostanie wpisany, niezapisany sekret). Zły sekret z IP spoza listy wyjątków skutkuje banem tego IP na trackerze na 30 dni — własne IP tego serwera jest tam wyjątkiem."
      test_ok: "Połączono — tryb trackera {mode}, {count} hashy na whitelist, przesunięcie zegara {skew}s, {ms} ms."
      test_fail: "Błąd: {error}."
      test_forbidden_hint: "Sprawdź ID klucza / sekret; tracker mógł też zbanować IP tego serwera (panel trackera → Whitelist → API bans)."
      scan_button: "Skanuj całe forum"
      scan_cancel: "Anuluj"
      scan_resume: "Wznów"
      scan_help: "Przechodzi wszystkie widoczne posty partiami (jedno żądanie na partię, bezpiecznie poniżej limitu czasu PHP), wyciąga magnet linki i wysyła je do trackera. Można uruchamiać wielokrotnie: istniejące hashe wracają jako już zarejestrowane. Przy błędzie trackera partia nie jest pomijana — naciśnij Wznów."
      scan_progress: "{processed}/{total} postów · {hashes} hashy · dodano {added} · istniejące {exists} · zbanowane {banned}"
      scan_done: "Skan zakończony: {processed} postów, {hashes} hashy ({added} dodano, {exists} istniejące, {banned} zbanowane)."
      scan_running: "Partia skanu już trwa (inna karta?). Spróbuj za chwilę."
      scan_cooldown: "Klient trackera jest w trybie odczekiwania po błędzie — sprawdź połączenie i naciśnij Wznów."
      scan_error: "Zatrzymano: {error}"
      scan_cancelled: "Anulowano — naciśnij Wznów, aby kontynuować od ostatniej partii."
    support:
      button: "Wesprzyj rozwój"
      title: "Wesprzyj tę modyfikację"
      description: "Jeśli uważasz tę modyfikację za przydatną, rozważ wsparcie jej rozwoju niewielką darowizną. Każdy wkład pomaga utrzymać projekt przy życiu."
