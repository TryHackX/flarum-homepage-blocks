      ratelimit_block_reset_full: "Przywróć pełny budżet"
      ratelimit_block_reset_empty: "Zacznij od zera (odnawiaj od 0)"
      ratelimit_block_reset_help: "Co dzieje się z budżetem po wygaśnięciu blokady IP. Tryb pełny jest łagodniejszy; tryb od zera dalej trzyma w ryzach (punkty wracają potem w tempie odnawiania). Podczas blokady punkty NIGDY się nie odnawiają — trwa ona zawsze pełny czas i nie jest zdejmowana wcześniej."
      ratelimit_costs_header: "Koszty akcji"
