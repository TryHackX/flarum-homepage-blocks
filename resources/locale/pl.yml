      ratelimit_block_header: "Po wyczerpaniu punktów → tymczasowa blokada IP"
      ratelimit_start: "Początkowy stan punktów"
      ratelimit_start_help: "Punkty startowe dla każdego odwiedzającego. Domyślnie: 10"
      ratelimit_refill_seconds: "Interwał odnawiania (sekundy)"
      ratelimit_refill_seconds_help: "Jak często dodawane jest +N punktów. Domyślnie: 15s"
      ratelimit_refill_amount: "Ilość punktów dodawana za interwał"
      ratelimit_refill_amount_help: "Ile punktów jest dodawane w każdym interwale. Domyślnie: 1"
      ratelimit_guest_extra: "Dodatkowy koszt dla niezalogowanych"
      ratelimit_guest_extra_help: "Dodawany do kosztu każdej akcji dla gości. Domyślnie: +2"
      ratelimit_cost_search: "Koszt — Wyszukiwanie / Filtry"
      ratelimit_block_seconds: "Czas blokady IP (sekundy)"
      ratelimit_block_seconds_help: "Jak długo IP pozostaje zablokowane po wyczerpaniu punktów. Podczas blokady punkty się nie odnawiają. Domyślnie: 60s"
      ratelimit_block_reset: "Gdy blokada się kończy"
      ratelimit_block_reset_full: "Przywróć pełny budżet"
      ratelimit_block_reset_empty: "Zacznij od zera (odnawiaj od 0)"
      ratelimit_block_reset_help: "Co dzieje się z budżetem po wygaśnięciu blokady IP. Tryb pełny jest łagodniejszy; tryb od zera dalej trzyma w ryzach (punkty wracają potem w tempie odnawiania). Podczas blokady punkty NIGDY się nie odnawiają — trwa ona zawsze pełny czas i nie jest zdejmowana wcześniej."
      ratelimit_costs_header: "Koszty akcji"
