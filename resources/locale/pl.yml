      category_label_help: "Pozostaw puste aby użyć domyślnego tłumaczenia."
      resolution_label: "Własna nazwa filtra rozdzielczości"
      resolution_label_help: "Pozostaw puste aby użyć domyślnego tłumaczenia."
    whitelist:
      enabled: "Włącz synchronizację whitelisty trackera"
      enabled_help: "Każdy magnet link opublikowany na forum (nowy post, edycja, zatwierdzenie) jest rejestrowany na białej liście trackera przez jego API serwer-serwer. Wymaga tryhackx-tracker >= 1.2.0 w trybie whitelist oraz PHP ext-curl."
      api_url: "Adres trackera"
      api_url_help: "Bazowy URL aplikacji trackera, np. https://tracker.example.org (tylko http/https, bez ścieżki na końcu)."
      api_key_id: "ID klucza API"
      api_key_id_help: "16-znakowy identyfikator klucza pokazany przy tworzeniu klienta API w panelu trackera (Whitelist → API clients)."
      api_secret: "Sekret API"
      api_secret_help: "Wklej sekret (lub cały token key_id.secret) i naciśnij Zapisz sekret. Jest przechowywany wyłącznie po stronie serwera i nigdy nie wraca do przeglądarki."
      secret_placeholder_set: "•••••••• (zapisany)"
      secret_placeholder_empty: "wklej sekret lub key_id.secret"
      secret_save: "Zapisz sekret"
      secret_clear: "Wyczyść"
      secret_is_set: "Sekret jest zapisany."
      secret_not_set: "Brak zapisanego sekretu — synchronizacja nieaktywna."
      secret_saved: "Sekret zapisany."
      secret_cleared: "Sekret usunięty."
      secret_error: "Nie udało się zapisać sekretu (niepoprawna wartość lub błąd żądania)."
      timeout: "Timeout (s)"
      timeout_help: "Limit czasu jednego żądania przy synchronizacji na żywo podczas zapisu posta (1–10 s, domyślnie 3). Błędy nigdy nie blokują posta."
      bare_hashes: "Wykrywaj też gołe 40-znakowe hashe hex w postach"
      bare_hashes_help: "Domyślnie wyłączone: na forum security gołe ciągi 40 hex to zwykle commity gita lub SHA-1 (IOC), nie torrenty. Magnet linki i fragmenty btih: są wykrywane zawsze."
      require_tracker: "Synchronizuj tylko magnety wskazujące na nasz tracker"
      require_tracker_help: "Domyślnie wyłączone. Po włączeniu hash jest wysyłany tylko wtedy, gdy jego magnet link ma w parametrze tr= (announce) jeden z poniższych hostów. Gołe fragmenty btih: i gołe hashe 40 hex nie mają trackera i są pomijane."
      tracker_hosts: "Hosty trackera"
      tracker_hosts_help: "Nazwy hostów lub IP Twojego trackera, rozdzielone przecinkami / nowymi liniami (akceptowane też host:port i pełne URL-e; dopasowanie bez rozróżniania wielkości liter). Pusta lista = nic nie zostanie wysłane — zgłosi to linia ostatniego błędu."
      test_button: "Testuj połączenie"
      test_help: "Wywołuje endpoint ping trackera z powyższymi wartościami (użyty zostanie wpisany, niezapisany sekret). Przed testem dodaj wychodzące IP tego forum do api_ban_exempt_ips w trackerze — domyślnie wyjątkiem są tylko własne adresy trackera; zły ID klucza / sekret skutkuje banem tego IP na trackerze na 30 dni."
      test_ok: "Połączono — tryb trackera {mode}, {count} hashy na whitelist, przesunięcie zegara {skew}s, {ms} ms."
      test_fail: "Błąd: {error}."
      test_forbidden_hint: "Sprawdź ID klucza / sekret; tracker mógł też zbanować IP tego serwera (panel trackera → Whitelist → API bans)."
      test_invalid_credentials_hint: "Nic nie wysłano: ID klucza musi mieć 16 znaków hex, a sekret 64 znaki hex (albo jeden token key_id.secret)."
      scan_button: "Skanuj całe forum"
      scan_cancel: "Anuluj"
      scan_resume: "Wznów"
      scan_help: "Przechodzi wszystkie widoczne posty partiami (jedno żądanie na partię, bezpiecznie poniżej limitu czasu PHP), wyciąga magnet linki i wysyła je do trackera. Można uruchamiać wielokrotnie: istniejące hashe wracają jako już zarejestrowane. Przy błędzie trackera partia nie jest pomijana — naciśnij Wznów."
      scan_progress: "{processed}/{total} postów · {hashes} hashy · pominięte {skipped} (inny tracker) · dodano {added} · istniejące {exists} · zbanowane {banned}"
      scan_done: "Skan zakończony: {processed} postów, {hashes} hashy ({added} dodano, {exists} istniejące, {banned} zbanowane)."
      scan_running: "Partia skanu już trwa (inna karta?). Spróbuj za chwilę."
      scan_cooldown: "Klient trackera jest w trybie odczekiwania po błędzie — sprawdź połączenie i naciśnij Wznów."
      scan_error: "Zatrzymano: {error}"
      scan_cancelled: "Anulowano — naciśnij Wznów, aby kontynuować od ostatniej partii."
